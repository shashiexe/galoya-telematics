name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Galoya Telematics APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Fast Maven Mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/mirror.init.gradle
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              if (repo.url.toString().contains("repo.maven.apache.org")) {
                                  repo.setUrl("https://repo1.maven.org/maven2/")
                              }
                          }
                      }
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          if (repo.url.toString().contains("repo.maven.apache.org")) {
                              repo.setUrl("https://repo1.maven.org/maven2/")
                          }
                      }
                  }
              }
          }
          EOF
          find "$FLUTTER_ROOT" -name "*.gradle*" -exec sed -i 's|mavenCentral()|maven { url = uri("https://repo1.maven.org/maven2/") }|g' {} + || true

      - name: Generate Clean Android Scaffold & Dependencies
        working-directory: mobile
        run: |
          rm -rf android
          flutter create . --org lk.galoya --project-name stafftrack --platforms android
          python3 patch_android.py
          flutter pub get

      - name: Build APK (Release)
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm,android-arm64 --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galoya-Telematics-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Deploy APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.2.0 mobile/build/app/outputs/flutter-apk/app-release.apk#Galoya-Telematics.apk --clobber || true

      - name: Trigger Server Deploy
        run: |
          curl -sL --max-time 60 -A "Mozilla/5.0" "https://track.galoya.lk/deploy_update.php?key=galoya2026" || true

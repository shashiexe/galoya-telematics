name: Build iOS IPA (iPhone)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Galoya Telematics iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean iOS Scaffold & Patch Permissions
        working-directory: mobile
        run: |
          rm -rf ios
          flutter create . --org lk.galoya --project-name stafftrack --platforms ios
          python3 patch_ios.py
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release Bundle
        working-directory: mobile
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package Payload into iOS IPA Archive
        working-directory: mobile
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Galoya-Telematics-iOS.ipa Payload
          ls -lh Galoya-Telematics-iOS.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galoya-Telematics-iOS-IPA
          path: mobile/build/ios/iphoneos/Galoya-Telematics-iOS.ipa

name: stafftrack
description: Staff GPS tracking and task (before/after photo) app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  geolocator: ^13.0.2
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.5
  battery_plus: ^6.1.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  geolocator_android: 4.5.6

flutter:
  uses-material-design: true
